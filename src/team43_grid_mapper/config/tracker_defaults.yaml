# team43_grid_mapper 的跟踪链默认参数；场景文件与显式启动参数在其后覆盖。
/**:
  ros__parameters:
    # ---------------- grid（栅格地图）----------------
    grid.resolution: 0.05
    grid.width_m: 12.0
    grid.height_m: 12.0
    grid.origin_xyz: [-6.0, -6.0, 0.0]
    grid.inflation_radius_m: 0.10
    # 官方要求"参赛队伍自行对比赛场地建图"→ 实机用导航栈 SLAM 的 /map 作为输入，
    # 由team43_grid_mapper保留输入分辨率/尺寸并换算原点，另生成膨胀图。
    # 仿真/离线回放时才切回 config（按 field.yaml 造一张假场地）。
    grid.map_source: topic              # topic（实机）| config（仿真）
    grid.map_topic: /map                # map_source=topic 时订阅（导航栈 SLAM 输出）
    grid.field_yaml: ""                 # 空 = 由 launch 显式注入绝对路径（推荐）；
                                        # 仅当留空且未经 launch 时，节点才回退到自动定位
    grid.out_dir: maps                  # 地图产物目录（赛前建图与收尾复写都用它）
    # 建图是渐进的：必须周期性重发，否则晚启动的 judge_io / team43_chassis_advisor
    # 只能拿到开赛瞬间那张（可能还是空的）地图。
    grid.republish_period_s: 2.0
    grid.write_preview_png: true        # 是否绘制 map_preview.png

