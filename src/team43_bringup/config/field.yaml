# src/team43_bringup/config/field.yaml
# 场地边界 + 障碍列表 + 栅格参数（map 系，给定点居中）。
grid:
  resolution: 0.05
  width_m: 12.0
  height_m: 12.0
  origin_xyz: [-6.0, -6.0, 0.0]
  inflation_radius_m: 0.10
boundary:                       # 边界多边形（map 系，逆时针）
  - [-6.0, -6.0]
  - [ 6.0, -6.0]
  - [ 6.0,  6.0]
  - [-6.0,  6.0]
obstacles:
  - type: rect
    center_xy: [2.0, 1.0]
    size_xy: [0.6, 0.6]
    yaw: 0.0
  - type: circle
    center_xy: [-1.5, 2.0]
    radius: 0.4
  - type: segment
    p0_xy: [-3.0, -2.0]
    p1_xy: [ 1.0, -2.0]
    width: 0.1
