# 本轮装车近似运行配置；来源data/现场外参记录.md及用户允许采用近似的确认。
# 已测尺寸与代理假设的对应见docs/记录/本轮装车配置与近似依据.md。
# B为圆柱上表面圆心，离地0.240m；前+x、左+y、上+z。
# 镜头前端代理光心；银圈圆心代理LiDAR原点；理想正交轴与固定安装rpy=0均属近似。
# 雷达R取已采静止重力的调平旋转，银圈法线近似LiDAR+z，其水平投影朝车头。
# 启动前保持底盘静止、相机水平朝车头；首组同步数据自动求世界对齐，不把odom_world_rpy=0当实测。
# confirmed保留未验收状态；比赛入口直接采用本文件数值，不等待人工确认。
/**:
  ros__parameters:
    use_sim_time: false
    localization.base_pose_source: odom
    localization.odom_topic: /red_standard_robot1/aft_mapped_to_init
    localization.odom_frame_id: lio_world
    localization.odom_child_frame_id: body
    localization.output_frame_id: odom
    localization.base_frame_id: base_link
    localization.sensor_extrinsics_confirmed: false
    localization.sensor_in_base_xyz:
    - 0.1611557716790553
    - -0.009911421073419007
    - -0.05566741195562554
    localization.sensor_in_base_rpy:
    - -0.7735758809388731
    - 0.0323276835866533
    - -1.5377129285719013
    localization.parent_transform_confirmed: false
    localization.source_parent_in_output_xyz:
    - 0.0
    - 0.0
    - 0.0
    localization.source_parent_in_output_rpy:
    - 0.0
    - 0.0
    - 0.0
    localization.odom_twist_source: pose_difference
    localization.publish_base_tf: true
    localization.origin_mode: judge_replay_start
    localization.origin_max_gap_s: 0.25
    localization.publish_map_odom: true
    localization.publish_world_odom: false
    kinematics.calibration_confirmed: false
    kinematics.joint_zero_known: false
    kinematics.joint_limits_confirmed: false
    kinematics.mounted_on_base_confirmed: false
    kinematics.calibrated_epoch: -1
    kinematics.odom_frame: odom
    kinematics.base_frame: base_link
    kinematics.base_mount_xyz:
    - 0.0
    - 0.03
    - 0.06
    kinematics.base_mount_rpy:
    - 0.0
    - 0.0
    - 0.0
    kinematics.yaw_to_pitch_xyz:
    - 0.0
    - 0.0
    - 0.08
    kinematics.pitch_gimbal_xyz:
    - 0.0
    - 0.0
    - 0.0
    kinematics.pitch_gimbal_rpy:
    - 0.0
    - 0.0
    - 0.0
    kinematics.gimbal_camera_xyz:
    - 0.0625
    - 0.0
    - 0.025
    kinematics.gimbal_camera_rpy:
    - 0.0
    - 0.0
    - 0.0
    kinematics.odom_world_rpy:
    - 0.0
    - 0.0
    - 0.0
    kinematics.joint_zero_rad:
    - 0.0
    - 0.0
    kinematics.yaw_limits_rad:
    - -1.3962634015954636
    - 1.3962634015954636
    kinematics.pitch_limits_rad:
    - -0.7853981633974483
    - 1.0471975511965976
    kinematics.imu_topic: /red_standard_robot1/gimbal
    perception.image_topic: /image_raw
    perception.corners_frame_id: camera_optical_frame
    perception.marker_corners_topic: /perception/marker_corners
    perception.camera_info_source: yaml
    perception.marker_size_m: 0.075
    perception.aruco_dict: DICT_4X4_50
    perception.target_digit: -1
    estimation.geometry_confirmed: false
    estimation.map_frame: map
    estimation.camera_frame: camera_optical_frame
    estimation.predict_dt: 0.1
    control.enabled: false
    control.search_enabled: false
    grid.map_source: topic
    grid.map_topic: /team43/slam_map
    grid.source_frame: lio_world
    grid.output_frame: map
    grid.output_basename: 43_map
    grid.out_dir: maps
    grid.external_map_transient_local: true
    grid.republish_period_s: 2.0
    grid.write_preview_png: false
    chassis.cmd_frame: map
    chassis.dir_block_unknown: true
    chassis.map_timeout_s: 5.0
    chassis.stop_radius_m: 0.45
    judge.team_id: '43'
    judge.enforce_v_floor: false
    judge.fresh_run: false
    judge.output_dir: ~/ws_championship/output
    kinematics.require_confirmation: false
    kinematics.bind_current_epoch: true
    kinematics.align_world_at_start: true
