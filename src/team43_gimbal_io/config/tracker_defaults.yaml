# team43_gimbal_io 的跟踪链默认参数；场景文件与显式启动参数在其后覆盖。
/**:
  ros__parameters:
    # ---------------- serial（串口链路）----------------
    # 默认留空：占位通配（如 /dev/ttyUSB*）不是合法设备路径，会让桥必然启动失败。
    # 比赛机上云台串口是 /dev/ttyUSB* 或 /dev/ttyACM*（主办方已 chmod 777），
    # 上场前用 `ls /dev/ttyUSB* /dev/ttyACM*` 确认实际设备名后显式传入。
    serial.port: ''
    serial.baud: 921600
    serial.exclusive: true              # 独占打开，失败即 FATAL 退出
    serial.read_timeout_s: 0.01
    serial.read_chunk: 256
    serial.rx_rate_hz: 200.0              # 收包轮询频率（读线程等价物，定时器实现）
    serial.cmd_rate_hz: 100.0             # 0x30 下发频率
    serial.omega_max: 2.0               # rad/s，自己先限幅再下发
    serial.fault_silence_s: 0.6         # > 下位机要求的 0.5s
    serial.shutdown_zero_frames: 5
    serial.cmd_fresh_s: 0.5             # 超过该时长没有新指令则发 (0,0) 保活
    serial.imu_timeout_s: 1.0           # ACTIVE 后多久没收到 0x01 记 WARN
    serial.bad_frame_window_s: 1.0      # 连续校验错统计窗口
    serial.bad_frame_limit: 50          # 窗口内 frames_bad 增量超过此值进故障
    serial.frame_origin_xyz: [0.0, 0.0, 0.0]   # TF world->gimbal_link 的平移（默认原点）


    # 本包独占的云台限位/故障参数。
    gimbal.limit_fault_margin: 0.10
    gimbal.runaway_factor: 1.5
    gimbal.err_thresh: 0.5
    gimbal.runaway_hold_s: 0.2
