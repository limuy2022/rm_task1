# Registered cloud and Odometry must come from the same Point-LIO instance.
# This node publishes in camera_init; it does not pretend camera_init is map.
/**:
  ros__parameters:
    cloud_topic: /red_standard_robot1/cloud_registered
    odom_topic: /red_standard_robot1/aft_mapped_to_init
    source_frame: camera_init
    pose_child_frame: body
    resolution: 0.05
    width_m: 20.0
    height_m: 20.0
    origin_xy: [-10.0, -10.0]
    # Required real measurement: RViz Publish Point on a floor return, read z.
    # While false: show z percentiles/status, never create a plausible empty map.
    floor_z: 0.0
    floor_confirmed: false
    obstacle_min: 0.15
    obstacle_max: 1.8
    ground_tolerance: 0.08
    min_range: 0.5
    max_range: 20.0
    angle_bin_deg: 0.5
    pose_max_delta: 0.04
    max_cloud_age: 0.5
    publish_hz: 1.0
    autosave_seconds: 10.0
    output_dir: ~/ws_championship/output/team47_mapping
    file_prefix: 47_slam_map
