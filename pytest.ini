# 全量 pytest（python3 -B -m pytest -q src --import-mode=importlib）的收集边界。
# src/install、src/log 是现场误在 src/ 内 colcon 构建的产物目录（gitignore 已忽略，
# 但目录仍在本机留存）：Humble 自带的 pytest 6.2 会把其中带 __init__.py 的包当
# Package 收集，launch_testing 插件随之 pyimport 陈旧副本，把旧代码顶替新代码
# 注入 sys.modules 并污染 sys.path——测试静默跑旧实现，新符号则收集失败。
# norecursedirs 阻止递归即可；CI 为干净检出、无这些目录，行为不变。
# 覆盖默认值时需原样保留 pytest 默认项（*.egg .* _darcs CVS build dist）。
[pytest]
norecursedirs =
    *.egg
    .*
    _darcs
    CVS
    build
    dist
    install
    log
    __pycache__
