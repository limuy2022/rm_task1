# 全量验证流水线：把 README「容器内验证」一条龙原样搬进 CI。
# 环境定义单一来源是仓库根 Dockerfile（osrf/ros:humble-desktop-full + pytest），
# 本文件不引入 pip、不重复环境，本地能全绿 CI 即全绿。
# 子模块 gimbal-edu-tools 必须拉取：test_consistency 会校验其中 virtual_gimbal
# 的 entry_points（bearing_sim.launch.py 引用了它的节点），且本地工作区始终
# 检出该子模块；.gitmodules 走 HTTPS 匿名可克隆。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build test image（复用根 Dockerfile）
        run: docker build -t rm-task1-humble-test .

      # 四层验证（与 README 容器命令逐字一致）：
      # colcon 全量构建（含 gimbal_interfaces 消息生成）→ C++ gtest →
      # pytest src → tools/verify_all_offline.py 23 项离线核验。
      # colcon 产物放 /tmp；verify 日志写 build/offline/（已 gitignore）。
      - name: Full verification（colcon build + gtest + pytest + tools 离线核验）
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            --user "$(id -u):$(id -g)" -e HOME=/tmp rm-task1-humble-test bash -c '
              source /opt/ros/humble/setup.bash &&
              colcon --log-base /tmp/clog build --build-base /tmp/cb \
                     --install-base /tmp/ci --symlink-install &&
              source /tmp/ci/setup.bash &&
              colcon --log-base /tmp/clog test --build-base /tmp/cb \
                     --install-base /tmp/ci --packages-select gimbal_serial_42 &&
              colcon --log-base /tmp/clog test-result --test-result-base /tmp/cb --verbose &&
              python3 -B -m pytest -q src --import-mode=importlib &&
              python3 -B tools/verify_all_offline.py'

      # 失败排查用：verify_all_offline.py 的逐项日志与 result.json。
      # 容器以 runner 同 uid 运行，产物属主与 runner 一致可直接读取。
      - name: Upload offline verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-verification
          path: build/offline/
          retention-days: 3

  simulation:
    name: 仿真 / ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # 一个场景失败后继续收集其他场景的独立结果。
      fail-fast: false
      matrix:
        include:
          - scenario: navigation
            target: test
          - scenario: gazebo_lio
            target: gazebo-sim
          - scenario: gazebo_vision
            target: gazebo-sim
    steps:
      - name: Checkout（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build simulation image（复用根 Dockerfile）
        run: docker build --target "${{ matrix.target }}" -t rm-task1-simulation .

      - name: Run simulation（与本地共用入口）
        timeout-minutes: 25
        run: |
          docker run --rm -v "$PWD":/workspace -w /workspace \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -e ROS_DOMAIN_ID=94 -e ROS_LOCALHOST_ONLY=1 \
            -e IGN_PARTITION=rm_task1_ci_${{ matrix.scenario }} \
            -e LIBGL_ALWAYS_SOFTWARE=1 \
            rm-task1-simulation bash tools/run_simulation_ci.sh "${{ matrix.scenario }}"

      - name: Upload simulation results（含失败日志）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-${{ matrix.scenario }}
          path: build/offline/ci_simulation/${{ matrix.scenario }}/
          if-no-files-found: warn
          retention-days: 7
